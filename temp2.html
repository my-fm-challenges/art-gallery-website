<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEMP2</title>
    <style>
      * {
        box-sizing: border-box;
      }

      h1,
      h2,
      h3,
      p,
      body {
        margin: 0;
      }
      picture {
        display: block;
      }

      picture img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* GALLERY */
      /* MOBILE FIRST (Мобилка по умолчанию) */

      .gallery {
        display: grid;
        grid-template-columns: 1fr;
      }

      .gallery-card {
        display: grid;
      }

      .gallery-card__picture {
        order: 1;
      }

      .gallery-card__content {
        order: 2;
      }

      /* TABLET & DESKTOP (От 768px и выше) */
      @media (width >= 768px) {
        .gallery {
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
        }

        .gallery-card {
          grid-column: 1 / -1;

          grid-template-columns: repeat(2, 1fr);
          align-items: center;
        }

        .gallery-card__picture {
          order: 2;
        }

        .gallery-card__content {
          order: 1;
        }

        /* image-grid-2.jpg */
        .gallery__item:nth-child(2) {
          grid-column: 1 / 2;
          grid-row: 2/4;
        }

        /* image-grid-3 */
        /* для надежности указываем явно */
        .gallery__item:nth-child(3) {
          grid-column: 2/3;
        }

        .gallery-footer {
          grid-column: 2/3;
          display: flex;
          flex-direction: column;
          justify-content: flex-start;
        }
      }
      @media (width >= 1024px) {
        .gallery {
          gap: 32px;
        }
      }
    </style>
  </head>
  <body>
    <article class="gallery">
      <!-- 1. BLOCK-1 (Объединяем заголовок и картинку в одну карточку-блок) -->
      <div class="gallery__item gallery-card">
        <div class="gallery-card__content">
          <h2 class="gallery-card__title">Your Day at the Gallery</h2>
          <p class="gallery-card__subtitle">Wander through our distinct collections and find new insights about our artists. Dive into the details of their creative process.</p>
        </div>
        <picture class="gallery-card__picture">
          <source media="(width >= 1024px)" srcset="assets/desktop/image-grid-1.jpg" width="635" height="400" />
          <source media="(width >= 768px)" srcset="assets/tablet/image-grid-1.jpg" width="398" height="400" />
          <img src="assets/mobile/image-grid-1.jpg" alt="Описание 1" width="343" height="320" />
        </picture>
      </div>

      <!-- 2. IMAGE-2 -->
      <picture class="gallery__item">
        <source media="(width >= 1024px)" srcset="assets/desktop/image-grid-2.jpg" width="635" height="800" />
        <source media="(width >= 768px)" srcset="assets/tablet/image-grid-2.jpg" width="398" height="800" />
        <img src="assets/mobile/image-grid-2.jpg" alt="Описание 2" width="343" height="320" />
      </picture>

      <!-- 3. IMAGE-3 -->
      <picture class="gallery__item">
        <source media="(width >= 1024px)" srcset="assets/desktop/image-grid-3.jpg" width="635" height="400" />
        <source media="(width >= 768px)" srcset="assets/tablet/image-grid-3.jpg" width="398" height="400" />
        <img src="assets/mobile/image-grid-3.jpg" alt="Описание 3" width="343" height="320" />
      </picture>

      <!-- 4. BLOCK-2 (Используем Вариант 2 с БЭМ-миксом) -->
      <div class="gallery__item gallery-footer">
        <h2 class="gallery-footer__title">COME & BE INSPIRED</h2>
        <p class="gallery-footer__subtitle">We’re excited to welcome you to our gallery and see how our collections influence you.</p>
      </div>
    </article>
  </body>
</html>
