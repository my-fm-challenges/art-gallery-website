<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }

      h1,
      h2,
      h3,
      body,
      p {
        margin: 0;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 1.2fr 1fr;
        grid-template-areas: "title photo content";
        grid-template-rows: auto auto;
        max-inline-size: 1440px;
        margin-inline: auto;
      }

      .a {
        grid-area: title;
        position: relative;
      }

      .b {
        grid-area: photo;
      }

      .c {
        grid-area: content;
      }

      .b__image {
        display: block;
      }

      .a__mask {
        position: absolute;
        background-color: #030303;
        inset: 0;
        overflow: clip;
        z-index: 1;
      }

      .a__title-light {
        color: rgb(250, 250, 250);
      }

      .a__title-dark {
        color: #030303;
      }

      .a__title {
        /* чтобы не влияло на ширину блока! */
        position: absolute;
        font-size: 96px;
        line-height: 0.85;
        translate: 165px 190px;
        font-family: system-ui;
        font-weight: bold;
        text-wrap: nowrap;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="a">
        <div class="a__mask">
          <p class="a__title a__title-light">MODERN<br />ART GALLERY</p>
        </div>
        <h1 class="a__title a__title-dark">MODERN<br />ART GALLERY</h1>
      </div>
      <div class="b">
        <img src="assets/image-hero.jpg" alt="" class="b__image" />
      </div>
      <div class="c">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quidem labore velit aperiam in natus quod repellendus ab, obcaecati, praesentium beatae inventore pariatur! Eveniet unde vitae sapiente assumenda perferendis, voluptatibus repudiandae.</div>
    </div>
  </body>
</html>
