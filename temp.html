<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEMP</title>
    <style>
      * {
        box-sizing: border-box;
      }

      h1,
      h2,
      h3,
      body,
      p {
        margin: 0;
      }

      * {
        box-sizing: border-box;
      }

      :root {
        --grid-gap: 30px;
        --container-max-width: 1110px;
      }

      .grid-12 {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        grid-auto-rows: 1fr;
        gap: var(--grid-gap);
        max-width: var(--container-max-width);
        margin: 0 auto;
        /* padding: 0 32px; */
      }

      .grid-item-1 {
        grid-column: 1 / -1;

        display: grid;
        grid-template-columns: subgrid;
      }

      .grid-item-header {
        grid-column: 1 / 5;
      }

      .grid-item-image {
        grid-column: 6 / -1;
      }

      .grid-item-2 {
      }
      .grid-item-3 {
      }

      img {
        display: block;
        /* max-width: 100%; */
        height: auto;
        width: 100%;
        object-fit: contain;
      }

      .layout {
        display: grid;
        grid-template-columns:
          [full-start] minmax(12px, 1fr)
          [content-start] repeat(12, [col-start] minmax(0, calc(1440px / 12)) [col-end]) [content-end]
          minmax(12px, 1fr) [full-end];
        grid-auto-rows: 1fr;
      }

      .layout > * {
        grid-column: content-start / content-end;
      }
      .layout-full-width {
        grid-column: full-start / full-end;
      }

      .content {
        background-color: antiquewhite;
      }
    </style>
  </head>

  <body>
    <div class="grid-12">
      <div class="grid-item-1">
        <div class="grid-item-header">
          <h1>Your Day at<br />the Gallery</h1>
          <p>Wander through our distinct collections and find new insights about our artists. Dive into the details of their creative process.</p>
        </div>
        <div class="grid-item-image"><img src="assets/desktop/image-grid-1.jpg" alt="" /></div>
      </div>
      <div class="grid-item-2"></div>
      <div class="grid-item-3"></div>
    </div>

    <div class="layout">
      <div class="content">123</div>
    </div>
  </body>
</html>
