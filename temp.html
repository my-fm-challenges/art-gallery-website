<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEMP</title>
    <style>
      * {
        box-sizing: border-box;
      }

      h1,
      h2,
      h3,
      body,
      p {
        margin: 0;
      }

      * {
        box-sizing: border-box;
      }

      h1,
      body,
      p {
        margin: 0;
      }

      /* Мобильные стили (до 1024px) */
      .container {
        display: grid;
        grid-template-columns: 1fr;
      }

      .content {
        display: grid;
        gap: 24px;
        /* Здесь можно спокойно задавать background, padding, border для мобилки */
      }

      /* Десктопные стили (от 1024px) */
      @media (width >= 1024px) {
        .container {
          grid-template-columns: 1fr 1fr; /* Две колонки на десктопе */
          gap: 40px;
        }

        .content {
          grid-column: 1 / -1; /* Растягиваем обертку на обе колонки родителя */
          display: grid;
          grid-template-columns: subgrid; /* Наследуем сетку родителя! */
          gap: inherit;
        }

        .title__wrapper {
          grid-column: 1; /* h1 улетает в левую колонку */
        }

        .content__wrapper {
          grid-column: 2; /* p и button улетают в правую колонку */
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- .content живет как единое целое до 1024px -->
      <div class="content">
        <div class="title__wrapper">
          <h1>TITLE TEXT</h1>
        </div>
        <div class="content__wrapper">
          <div class="content__text">
            <p>Lorem ipsum dolor sit amet...</p>
          </div>
          <button>Press Me</button>
        </div>
      </div>
    </div>
  </body>
</html>
