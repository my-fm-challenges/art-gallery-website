<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png" />

    <link rel="stylesheet" href="style2.css" />

    <title>Frontend Mentor | Art gallery website</title>
  </head>
  <body>
    <section class="hero">
      <div class="hero__image">
        <picture>
          <source media="(width >= 1024px)" srcset="assets/desktop/image-hero.jpg" width="540" height="800" />
          <source media="(width >= 768px)" srcset="assets/tablet/image-hero.jpg" width="437" height="700" />
          <img src="assets/mobile/image-hero.jpg" alt="" width="375" height="240" />
        </picture>
      </div>

      <div class="hero__content-wrapper">
        <div class="hero__title">
          <div class="hero__title-mask">
            <p class="hero__title-text hero__title-text--light" aria-hidden="true">MODERN<br />ART GALLERY</p>
          </div>
          <h1 class="hero__title-text hero__title-text--dark">MODERN<br />ART GALLERY</h1>
        </div>
        <div class="hero__content">
          <p class="hero__text">The arts in the collection of the Modern Art Gallery all started from a spark of inspiration. Will these pieces inspire you? Visit us and find out.</p>
          <a class="btn btn--arrow">
            <span class="btn__label">OUR LOCATION</span>
            <span class="btn__icon"
              ><svg width="10" height="24" xmlns="http://www.w3.org/2000/svg"><path stroke="currentColor" stroke-width="2" fill="none" d="m1 0 8 12-8 12" /></svg>
            </span>
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
