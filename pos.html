<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        background-color: blanchedalmond;
        width: 500px;
        height: 500px;

        position: relative;
      }

      .box-1 {
        width: 300px;
        height: 300px;
        background-color: orange;

        position: absolute;
        right: 0;
        bottom: 0;
      }

      .box-2 {
        width: 100px;
        height: 100px;
        background-color: brown;

        position: absolute;
        right: 0;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box-1">
        <div class="box-2"></div>
      </div>
    </div>
  </body>
</html>
